services:
  cctrace:
    build:
      context: .
      dockerfile: Dockerfile
    image: claude-code-trace:latest
    container_name: claude-code-trace
    restart: unless-stopped
    ports:
      # Host:Container. Change the host port to expose elsewhere.
      - "${CCTRACE_HOST_PORT:-1421}:1421"
    environment:
      # Override these if you change the container-side port.
      CCTRACE_HTTP_HOST: 0.0.0.0
      CCTRACE_HTTP_PORT: 1421
      CCTRACE_STATIC_DIR: /app/dist
      # Optional secret created by script/redeploy.sh. The entrypoint reads it
      # server-side; the browser never receives the API key.
      JEV_API_KEY_FILE: /home/app/.config/claude-code-trace/jev_api_key
    volumes:
      # Claude Code writes sessions to ~/.claude/projects on the host.
      # Mount read-only — the app never needs to write here.
      - "${CLAUDE_HOME:-${HOME}/.claude}:/home/app/.claude:ro"
      # Codex plugin: only the rollout folders it scans, so auth.json and
      # config.toml stay out of the container.
      - "${CODEX_HOME:-${HOME}/.codex}/sessions:/home/app/.codex/sessions:ro"
      - "${CODEX_HOME:-${HOME}/.codex}/archived_sessions:/home/app/.codex/archived_sessions:ro"
      # Antigravity plugin: only the brain folder of each flavor it scans (IDE
      # and CLI), so the Gemini OAuth credentials stay out of the container.
      - "${CCTRACE_GEMINI_DIR:-${HOME}/.gemini}/antigravity-ide/brain:/home/app/.gemini/antigravity-ide/brain:ro"
      - "${CCTRACE_GEMINI_DIR:-${HOME}/.gemini}/antigravity/brain:/home/app/.gemini/antigravity/brain:ro"
      - "${CCTRACE_GEMINI_DIR:-${HOME}/.gemini}/antigravity-cli/brain:/home/app/.gemini/antigravity-cli/brain:ro"
      # Persist settings.json (projects dir, WSL distros, allowed CORS
      # origins) and the optional Jev API key across container recreation —
      # without this they only live in the container's writable layer and
      # reset on every recreate.
      - cctrace-config:/home/app/.config
    healthcheck:
      # CMD-SHELL always runs via /bin/sh, which on this image is dash and
      # doesn't support the /dev/tcp redirect below — invoke bash explicitly.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1421"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  cctrace-config:
