[default]
description = "Default permissions for all claude-code-trace commands"
permissions = [
  "allow-discover-sessions",
  "allow-load-session",
  "allow-load-message",
  "allow-get-session-meta",
  "allow-watch-session",
  "allow-unwatch-session",
  "allow-get-git-info",
  "allow-get-debug-log",
  "allow-watch-picker",
  "allow-unwatch-picker",
  "allow-get-project-dirs",
  "allow-get-settings",
  "allow-set-projects-dir",
  "allow-list-wsl-distros",
  "allow-set-wsl-distros",
  "allow-set-allowed-origins",
  "allow-list-clients",
  "allow-register-client",
  "allow-reissue-client",
  "allow-revoke-client",
  "allow-analytics",
  "allow-switch-to-browser",
  "allow-focus-session-window",
  "allow-list-antigravity-brain-folders",
  "allow-get-antigravity-brain-root",
  "allow-set-antigravity-enabled",
  "allow-set-antigravity-root",
  "allow-open-antigravity-folder",
  "allow-load-antigravity-session",
]

[[permission]]
identifier = "allow-analytics"
description = "Allow configuring and running explicitly user-triggered efficiency analysis"
commands.allow = [
  "get_analytics_settings",
  "set_analytics_settings",
  "set_jev_api_key",
  "clear_jev_api_key",
  "test_jev_connection",
  "set_recommendation_provider_api_key",
  "clear_recommendation_provider_api_key",
  "test_recommendation_provider",
  "prepare_session_efficiency_payload",
  "start_session_efficiency_analysis",
  "list_efficiency_analysis_jobs",
  "get_session_efficiency",
  "list_efficiency_summaries",
  "delete_session_efficiency",
  "cancel_efficiency_analysis",
]

[[permission]]
identifier = "allow-discover-sessions"
description = "Allow discovering sessions across project directories"
commands.allow = ["discover_sessions"]

[[permission]]
identifier = "allow-load-session"
description = "Allow loading a session file"
commands.allow = ["load_session"]

[[permission]]
identifier = "allow-load-message"
description = "Allow loading a single full (heavy-body) message by index"
commands.allow = ["load_message"]

[[permission]]
identifier = "allow-get-session-meta"
description = "Allow getting session metadata"
commands.allow = ["get_session_meta"]

[[permission]]
identifier = "allow-watch-session"
description = "Allow watching a session file for changes"
commands.allow = ["watch_session"]

[[permission]]
identifier = "allow-unwatch-session"
description = "Allow stopping session file watching"
commands.allow = ["unwatch_session"]

[[permission]]
identifier = "allow-get-git-info"
description = "Allow getting git information"
commands.allow = ["get_git_info"]

[[permission]]
identifier = "allow-get-debug-log"
description = "Allow reading debug log"
commands.allow = ["get_debug_log"]

[[permission]]
identifier = "allow-watch-picker"
description = "Allow watching picker for changes"
commands.allow = ["watch_picker"]

[[permission]]
identifier = "allow-unwatch-picker"
description = "Allow stopping picker watching"
commands.allow = ["unwatch_picker"]

[[permission]]
identifier = "allow-get-project-dirs"
description = "Allow getting project directories"
commands.allow = ["get_project_dirs"]

[[permission]]
identifier = "allow-get-settings"
description = "Allow reading app settings"
commands.allow = ["get_settings"]

[[permission]]
identifier = "allow-set-projects-dir"
description = "Allow setting the projects directory"
commands.allow = ["set_projects_dir"]

[[permission]]
identifier = "allow-list-wsl-distros"
description = "Allow listing installed WSL distributions"
commands.allow = ["list_wsl_distros"]

[[permission]]
identifier = "allow-set-wsl-distros"
description = "Allow setting the WSL distributions to discover"
commands.allow = ["set_wsl_distros"]

[[permission]]
identifier = "allow-set-allowed-origins"
description = "Allow setting extra CORS allowed origins"
commands.allow = ["set_allowed_origins"]

[[permission]]
identifier = "allow-list-clients"
description = "Allow listing the accepted HTTP API clients"
commands.allow = ["list_clients"]

[[permission]]
identifier = "allow-register-client"
description = "Allow registering a new accepted HTTP API client"
commands.allow = ["register_client"]

[[permission]]
identifier = "allow-reissue-client"
description = "Allow reissuing an accepted client's credential"
commands.allow = ["reissue_client"]

[[permission]]
identifier = "allow-revoke-client"
description = "Allow revoking an accepted HTTP API client"
commands.allow = ["revoke_client"]

[[permission]]
identifier = "allow-switch-to-browser"
description = "Allow switching to browser mode"
commands.allow = ["switch_to_browser"]

[[permission]]
identifier = "allow-focus-session-window"
description = "Allow focusing a live session's terminal window"
commands.allow = ["focus_session_window"]

# Antigravity (Gemini IDE) brain folders — read-only conversation envelopes.
# Granted as a set: the feature is inert in the desktop app unless all six are
# present, because the picker lists folders, resolves the root, toggles the
# source, lets the user point it elsewhere, reveals a folder, and loads a
# transcript.
#
# Note on `set_antigravity_root` / `open_antigravity_folder`: the backend
# validates that the path exists (root) or is a directory (open), but it does
# not confine either to the discovered brain root. The ACL entry is therefore a
# capability grant to this app's own webview, not a sandbox — anything running
# in the webview can already do both. If that boundary ever needs to hold, it
# has to be enforced in the command, not here.

[[permission]]
identifier = "allow-list-antigravity-brain-folders"
description = "Allow listing read-only Antigravity conversation folders"
commands.allow = ["list_antigravity_brain_folders"]

[[permission]]
identifier = "allow-get-antigravity-brain-root"
description = "Allow resolving which Antigravity brain directory is being read"
commands.allow = ["get_antigravity_brain_root"]

[[permission]]
identifier = "allow-set-antigravity-enabled"
description = "Allow turning Antigravity conversation discovery on or off"
commands.allow = ["set_antigravity_enabled"]

[[permission]]
identifier = "allow-set-antigravity-root"
description = "Allow pointing the Antigravity reader at a specific brain directory"
commands.allow = ["set_antigravity_root"]

[[permission]]
identifier = "allow-open-antigravity-folder"
description = "Allow revealing an Antigravity conversation folder in the file manager"
commands.allow = ["open_antigravity_folder"]

[[permission]]
identifier = "allow-load-antigravity-session"
description = "Allow reading an Antigravity conversation transcript (read-only)"
commands.allow = ["load_antigravity_session"]
