version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      - dependency-name: "marked"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: pip
    directory: /tui-py
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
